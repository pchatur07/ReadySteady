<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReadySteady · Canteen pre-ordering</title>
  <link rel="icon" type="image/png" href="/static/img/logo.png">
  <link rel="stylesheet" href="/static/style.css">
  <script>
    // apply the saved theme before first paint to avoid a flash of the wrong mode
    (function () {
      var t = null;
      try { t = localStorage.getItem("rs-theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <header class="topbar glass">
    <button id="hamburger" class="icon-btn hamburger" aria-label="Open menu" aria-expanded="false" aria-controls="drawer">
      <span></span><span></span><span></span>
    </button>
    <div class="brand"><span class="logo"><img src="/static/img/logo-glyph.png" alt="ReadySteady logo"></span> ReadySteady</div>
    <div class="topbar-right">
      <button id="themeBtn" class="icon-btn theme-btn" aria-label="Toggle light / dark mode" title="Toggle light / dark mode">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
      </button>
      <div id="userbar" class="userbar"></div>
    </div>
  </header>

  <div id="scrim" class="scrim" hidden></div>
  <aside id="drawer" class="drawer glass" aria-label="Navigation menu" aria-hidden="true">
    <div class="drawer-head">
      <div class="brand"><span class="logo"><img src="/static/img/logo-glyph.png" alt=""></span>
        <div class="brand-text">ReadySteady<small>Canteen pre-ordering</small></div>
      </div>
      <button id="drawerClose" class="icon-btn" aria-label="Close menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <nav id="drawerNav" class="drawer-nav"></nav>
    <div id="drawerFoot" class="drawer-foot"></div>
  </aside>

  <main id="app" aria-live="polite"></main>
  <div id="toast" class="toast" role="status" hidden></div>

  <div id="tickOverlay" class="tick-overlay" hidden>
    <svg class="tick" viewBox="0 0 96 96" aria-hidden="true">
      <circle class="tick-ring" cx="48" cy="48" r="42" fill="none" stroke-width="5"/>
      <path class="tick-check" d="M30 49l13 13 24-27" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <p class="tick-label">Order placed</p>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
